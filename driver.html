<!DOCTYPE html>
<html>
<head>

<title>Buggy Driver Location</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<h2>Buggy Driver Login</h2>

<label>Enter PIN</label>
<br><br>

<input type="password" id="pinInput" placeholder="Enter 4 digit PIN">

<br><br>

<button onclick="authenticate()">Login</button>

<p id="loginStatus"></p>

<div id="driverPanel" style="display:none">

<h2 id="buggyName"></h2>

<button onclick="startSharing()">Start Sharing Location</button>

<p id="status"></p>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAvjtrYcKPdME8cClw2uUrspUldYXFw6B-g",
  authDomain: "mobility-ca790.firebaseapp.com",
  databaseURL: "https://mobility-ca790-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobility-ca790",
  storageBucket: "mobility-ca790.firebasestorage.app",
  messagingSenderId: "832491995447",
  appId: "1:832491995447:web:9f5de3b844e3119f79ab2"
};

firebase.initializeApp(firebaseConfig);


/* PIN → Buggy mapping */

const pinBuggyMap = {

"1421":"buggy1",
"2632":"buggy2",
"3743":"buggy3",
"4854":"buggy4",
"5965":"buggy5",
"6176":"buggy6",
"7287":"buggy7",
"8398":"buggy8"

};

let currentBuggy = null;


function authenticate(){

const pin = document.getElementById("pinInput").value;

if(pinBuggyMap[pin]){

currentBuggy = pinBuggyMap[pin];

document.getElementById("driverPanel").style.display = "block";

document.getElementById("loginStatus").innerText = "Login successful";

document.getElementById("buggyName").innerText = "Driver for " + currentBuggy;

}else{

document.getElementById("loginStatus").innerText = "Invalid PIN";

}

}


function startSharing(){

navigator.geolocation.watchPosition(function(position){

const lat = position.coords.latitude;
const lng = position.coords.longitude;

firebase.database().ref("drivers/"+currentBuggy).set({
lat:lat,
lng:lng,
time:Date.now()
});

document.getElementById("status").innerText =
"Location updated: " + lat + ", " + lng;

},
function(error){

document.getElementById("status").innerText =
"Location error: " + error.message;

},
{
enableHighAccuracy:true
});

}

</script>

</body>

</html>
