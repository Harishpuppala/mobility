<!DOCTYPE html>
<html>
<head>
<title>Buggy Driver Location</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<h2>Driver Location Sharing</h2>

<p id="buggyName"></p>

<button onclick="startSharing()">Start Sharing Location</button>

<p id="status"></p>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAvjtrYcKPdME8cClw2uUrspUldYXFw6B-g",
  authDomain: "mobility-ca790.firebaseapp.com",
  databaseURL: "https://mobility-ca790-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobility-ca790",
  storageBucket: "mobility-ca790.firebasestorage.app",
  messagingSenderId: "832491995447",
  appId: "1:832491995447:web:9f5de3b844e3119f79ab2"
};

firebase.initializeApp(firebaseConfig);

function getBuggyId(){
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get("buggy") || "buggy1";
}

document.getElementById("buggyName").innerText =
"Driver ID: " + getBuggyId();

function startSharing(){

  const buggyId = getBuggyId();

  document.getElementById("status").innerText =
  "Sharing location...";

  navigator.geolocation.watchPosition(function(position){

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    firebase.database().ref("drivers/"+buggyId).set({
      lat:lat,
      lng:lng,
      time:Date.now()
    });

    document.getElementById("status").innerText =
    "Location updated: " + lat + ", " + lng;

  },
  function(error){
    document.getElementById("status").innerText =
    "Location error: " + error.message;
  },
  {
    enableHighAccuracy:true
  });

}

</script>

</body>
</html>
