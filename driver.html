<!-- ONLY the listenDemand() function is updated -->

<script>

function listenDemand(){

firebase.database().ref("requests").on("value",function(snapshot){

let demandArray=[];
let totalDemand=0;
let assignedBuggy=null;

/* Initialize all blocks */

Object.keys(blockLocations).forEach(function(block){

demandArray.push({
block:block,
count:0,
assignedTo:null
});

});

/* Update from Firebase */

snapshot.forEach(function(child){

const block=child.key;
const data=child.val()||{};
const count=data.count||0;
const assignedTo=data.assignedTo||null;

const item=demandArray.find(x=>x.block===block);

if(item){
item.count=count;
item.assignedTo=assignedTo;
}

/* ✅ INCLUDE ALL BLOCKS (ADMIN INCLUDED) */

totalDemand += count;

/* Track assigned buggy */

if(assignedTo){
assignedBuggy=assignedTo;
}

});

/* SORT */

demandArray.sort((a,b)=>b.count-a.count);

/* ✅ FINAL DISPATCH LOGIC */

let allowMultiple = true;

/* Always allow first buggy */

if(!assignedBuggy){
allowMultiple = true;
}

/* Restrict second buggy */

else if(totalDemand <= 5){
allowMultiple = false;
}

/* UI */

const container=document.getElementById("demandList");
container.innerHTML="";

Object.values(demandMarkers).forEach(m=>driverMap.removeLayer(m));
demandMarkers={};

demandArray.forEach(function(item){

const row=document.createElement("div");
row.className="block";

let action="";

/* CASE 1: Not assigned */

if(!item.assignedTo){

if(allowMultiple || !assignedBuggy){

action=`<button onclick="claim('${item.block}')">Claim</button>`;

}else{

action=`<span class="assigned">Not required</span>`;

}

}

/* CASE 2: Assigned to current buggy */

else if(item.assignedTo===currentBuggy){

action=`
<button class="boarded" onclick="boarded('${item.block}')">Boarded</button>
<button onclick="setRemaining('${item.block}',2)">2</button>
<button onclick="setRemaining('${item.block}',4)">4</button>
<button onclick="setRemaining('${item.block}',6)">6</button>
`;

}

/* CASE 3: Assigned to another buggy */

else{

action=`<span class="assigned">Assigned to ${item.assignedTo}</span>`;

}

row.innerHTML=`
<span class="location">${item.block.replace("_"," ")}</span>
<span class="count">${item.count}</span>
${action}
`;

container.appendChild(row);

/* Map markers */

if(item.count>0){

const loc=blockLocations[item.block];

demandMarkers[item.block]=L.circleMarker(loc,{
radius:8,
color:"red"
}).addTo(driverMap);

}

});

/* STATUS */

if(!assignedBuggy){

document.getElementById("status").innerText =
"🟢 No buggy assigned yet";

}
else if(!allowMultiple && currentBuggy!==assignedBuggy){

document.getElementById("status").innerText =
"🚫 Only one buggy required";

}
else{

document.getElementById("status").innerText =
"🟢 You can operate";

}

});

}

</script>
