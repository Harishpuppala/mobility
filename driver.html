<!-- ONLY listenDemand() + boarded() are updated -->

<script>

function listenDemand(){

firebase.database().ref("requests").on("value",function(snapshot){

let demandArray=[];
let totalDemand=0;
let assignedBuggy=null;

Object.keys(blockLocations).forEach(function(block){
demandArray.push({block:block,count:0,assignedTo:null});
});

snapshot.forEach(function(child){

const block=child.key;
const data=child.val()||{};
const count=data.count||0;
const assignedTo=data.assignedTo||null;

const item=demandArray.find(x=>x.block===block);

if(item){
item.count=count;
item.assignedTo=assignedTo;
}

totalDemand+=count;

if(assignedTo){
assignedBuggy=assignedTo;
}

});

demandArray.sort((a,b)=>b.count-a.count);

let allowMultiple=true;

if(!assignedBuggy){
allowMultiple=true;
}
else if(totalDemand<=5){
allowMultiple=false;
}

const container=document.getElementById("demandList");
container.innerHTML="";

demandArray.forEach(function(item){

const row=document.createElement("div");
row.className="block";

let action="";

/* ✅ ALWAYS SHOW BOARDING OPTIONS */

action+=`
<button class="boarded" onclick="boarded('${item.block}')">Boarded</button>
<button onclick="setRemaining('${item.block}',2)">2</button>
<button onclick="setRemaining('${item.block}',4)">4</button>
<button onclick="setRemaining('${item.block}',6)">6</button>
`;

/* CLAIM */

if(!item.assignedTo){

if(allowMultiple || !assignedBuggy){
action+=`<button onclick="claim('${item.block}')">Claim</button>`;
}else{
action+=`<span class="assigned">Not required</span>`;
}

}

/* ASSIGNED TO OTHER */

else if(item.assignedTo!==currentBuggy){

action+=`<span class="assigned">Assigned to ${item.assignedTo}</span>`;

}

row.innerHTML=`
<span class="location">${item.block.replaceAll("_"," ")}</span>
<span class="count">${item.count}</span>
${action}
`;

container.appendChild(row);

});

/* STATUS */

if(!assignedBuggy){
document.getElementById("status").innerText="🟢 No buggy assigned yet";
}
else if(!allowMultiple && currentBuggy!==assignedBuggy){
document.getElementById("status").innerText="🚫 Only one buggy required";
}
else{
document.getElementById("status").innerText="🟢 You can operate";
}

});

}

/* ✅ UPDATED BOARDED (DO NOT RESET ASSIGNMENT) */

function boarded(block){

firebase.database().ref("requests/"+block+"/count").set(0);

}

</script>
