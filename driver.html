<!DOCTYPE html>
<html>
<head>

<title>Buggy Driver Location</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<h2>Driver Location Sharing</h2>

<label>Select Buggy</label>
<br><br>

<select id="buggySelect">
<option value="buggy1">Buggy 1</option>
<option value="buggy2">Buggy 2</option>
<option value="buggy3">Buggy 3</option>
<option value="buggy4">Buggy 4</option>
<option value="buggy5">Buggy 5</option>
<option value="buggy5">Buggy 6</option>
<option value="buggy5">Buggy 7</option>
<option value="buggy5">Buggy 8</option>
</select>

<br><br>

<button onclick="startSharing()">Start Sharing Location</button>

<p id="status"></p>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAvjtrYcKPdME8cClw2uUrspUldYXFw6B-g",
  authDomain: "mobility-ca790.firebaseapp.com",
  databaseURL: "https://mobility-ca790-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobility-ca790",
  storageBucket: "mobility-ca790.firebasestorage.app",
  messagingSenderId: "832491995447",
  appId: "1:832491995447:web:9f5de3b844e3119f79ab2"
};

firebase.initializeApp(firebaseConfig);

function startSharing(){

const buggyId = document.getElementById("buggySelect").value;

document.getElementById("status").innerText =
"Sharing location for " + buggyId;

navigator.geolocation.watchPosition(function(position){

const lat = position.coords.latitude;
const lng = position.coords.longitude;

firebase.database().ref("drivers/"+buggyId).set({
lat:lat,
lng:lng,
time:Date.now()
});

document.getElementById("status").innerText =
"Location updated: " + lat + ", " + lng;

},
function(error){

document.getElementById("status").innerText =
"Location error: " + error.message;

},
{
enableHighAccuracy:true
});

}

</script>

</body>

</html>
