<!DOCTYPE html>
<html>

<head>

<title>SRMAP Buggy</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Prevent browser cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Custom Styles -->
<link rel="stylesheet" href="style.css?v=4">

<!-- Map Library -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

<div class="title-left">
Buggy Live Tracker | SRM University-AP
</div>

<div id="activeBuggies" class="update-time">
Active Buggies: 0
</div>

<div id="lastUpdate" class="update-time">
Last updated: --
</div>

<div class="title-right">
Centre for Geospatial Technology
</div>

</div>


<!-- ================= FACULTY LOGIN ================= -->

<div id="loginContainer" class="requestBox" style="max-width:400px;margin:20px auto;">

<h3>Faculty Authentication</h3>

<input
type="text"
id="facultyIdInput"
placeholder="Enter Faculty ID"
style="
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
"
/>

<button
onclick="loginFaculty()"
class="reqBtn"
style="width:100%;"
>
Login
</button>

<p id="loginStatus"></p>

</div>


<!-- ================= USER DASHBOARD ================= -->

<div
class="userContainer"
id="mainDashboard"
style="display:none;"
>

<!-- MINI MAP -->

<div class="miniMapBox">
<div id="map"></div>
</div>


<!-- REQUEST SECTION -->

<div class="requestBox">

<div style="display:flex;justify-content:space-between;align-items:center;">

<h3>Request Buggy</h3>

<button
onclick="logoutFaculty()"
style="
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
"
>
Logout
</button>

</div>

<p id="facultyDisplay"></p>

<div class="requestGrid">

<button class="reqBtn" onclick="sendRequest('ADMIN')">
Admin
</button>

<button class="reqBtn" onclick="sendRequest('X_LAB')">
X Lab
</button>

<button class="reqBtn" onclick="sendRequest('SR_BLOCK_ENTRANCE')">
SR Block Entrance
</button>

<button class="reqBtn" onclick="sendRequest('STUDENT_COUNCIL')">
Student Council
</button>

<button class="reqBtn" onclick="sendRequest('CV_RAMAN')">
CV Raman
</button>

<button class="reqBtn" onclick="sendRequest('GATE3')">
Gate 3
</button>

<button class="reqBtn" onclick="sendRequest('GATE6')">
Gate 6
</button>

</div>

<p id="requestStatus"></p>

</div>

</div>


<!-- ================= LEGEND ================= -->

<div class="legend">

<img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="20">
Active

&nbsp;&nbsp;&nbsp;

<img src="https://cdn-icons-png.flaticon.com/512/744/744467.png" width="20">
Inactive

</div>


<!-- ================= APPLICATION SCRIPT ================= -->

<script src="app.js?v=6"></script>

<script>

/* =============================================== */
/* APPROVED FACULTY */
/* =============================================== */

const FACULTY_IDS = [
"22295",
"22296",
"22297",
"22298",
"22299",
"23104",
"23019"
];


/* =============================================== */
/* AUTO SESSION RESTORE */
/* =============================================== */

window.onload = function(){

const savedFaculty =
localStorage.getItem("facultyId");

const auth =
localStorage.getItem("facultyAuthenticated");

if(
savedFaculty &&
auth === "true" &&
FACULTY_IDS.includes(savedFaculty)
){

showDashboard(savedFaculty);

}

};


/* =============================================== */
/* FACULTY LOGIN */
/* =============================================== */

function loginFaculty(){

const facultyId =
document.getElementById("facultyIdInput")
.value
.trim();

if(!FACULTY_IDS.includes(facultyId)){

document.getElementById("loginStatus").innerText =
"Unauthorized Faculty ID";

return;

}


/* Save session */

localStorage.setItem(
"facultyId",
facultyId
);

localStorage.setItem(
"facultyAuthenticated",
"true"
);


/* Update app.js state */

currentFacultyId = facultyId;
isAuthenticated = true;


/* Open dashboard */

showDashboard(facultyId);

}


/* =============================================== */
/* SHOW DASHBOARD */
/* =============================================== */

function showDashboard(facultyId){

document.getElementById("loginContainer")
.style.display = "none";

document.getElementById("mainDashboard")
.style.display = "flex";

document.getElementById("facultyDisplay")
.innerText =
"Logged in as Faculty ID: " + facultyId;

}


/* =============================================== */
/* LOGOUT */
/* =============================================== */

function logoutFaculty(){

localStorage.removeItem("facultyId");
localStorage.removeItem("facultyAuthenticated");

currentFacultyId = null;
isAuthenticated = false;

window.location.reload();

}


/* =============================================== */
/* CLEAR VERY OLD LOCAL CACHE */
/* =============================================== */

const lastVisit = localStorage.getItem("lastVisitTime");

if(lastVisit){

const age = Date.now() - parseInt(lastVisit);

/* 12 hours */

if(age > 43200000){

localStorage.removeItem("lastBuggyRequest");
localStorage.removeItem("lastBuggyRequestBlock");
localStorage.removeItem("lastBuggyRequestTime");

}

}

localStorage.setItem("lastVisitTime",Date.now());



/* =============================================== */
/* SEND REQUEST */
/* =============================================== */

function sendRequest(block){

if(!isAuthenticated){

document.getElementById("requestStatus").innerText =
"Faculty authentication required.";

return;

}

const lastRequest =
localStorage.getItem("lastBuggyRequestBlock");

const lastTime =
localStorage.getItem("lastBuggyRequestTime");


/* Prevent repeated requests */

if(lastTime){

const diff = Date.now() - parseInt(lastTime);

if(diff < 600000){

document.getElementById("requestStatus").innerText =
"You already requested a buggy at " +
lastRequest.replaceAll("_"," ") +
". Please wait a few minutes.";

return;

}

}


/* Call request function */

requestBuggy(block);


/* Save locally */

localStorage.setItem(
"lastBuggyRequestBlock",
block
);

localStorage.setItem(
"lastBuggyRequestTime",
Date.now()
);


/* Disable buttons */

const buttons =
document.querySelectorAll(".reqBtn");

buttons.forEach(btn=>{

btn.disabled = true;
btn.style.opacity = 0.5;

});


/* Auto-enable after 10 min */

setTimeout(function(){

buttons.forEach(btn=>{

btn.disabled = false;
btn.style.opacity = 1;

});

},600000);


/* Status */

document.getElementById("requestStatus").innerText =
"Request sent from " +
block.replaceAll("_"," ") +
". Please wait for the buggy.";

}



/* =============================================== */
/* FORCE REFRESH ON BACK/FORWARD CACHE */
/* =============================================== */

window.onpageshow = function(event){

if(event.persisted){

window.location.reload();

}

};

</script>

</body>

</html>
