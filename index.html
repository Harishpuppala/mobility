<!DOCTYPE html>
<html>

<head>

<title>SRMAP Buggy</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<div class="header">

<div class="title-left">
Buggy Live Tracker | SRM University-AP
</div>

<div id="activeBuggies" class="update-time">
Active Buggies: 0
</div>

<div id="lastUpdate" class="update-time">
Last updated: --
</div>

<div class="title-right">
Centre for Geospatial Technology
</div>

</div>


<!-- Request Panel (for passengers) -->

<div class="request-panel">

<b>Request Buggy</b>

<button onclick="requestBuggy('CV_RAMAN')">CV Raman</button>
<button onclick="requestBuggy('SR_BLOCK')">SR Block</button>
<button onclick="requestBuggy('ADMIN')">Admin</button>
<button onclick="requestBuggy('X_LAB')">X Lab</button>
<button onclick="requestBuggy('JC_BOSE')">JC Bose</button>

<p id="requestStatus"></p>

</div>


<!-- Demand Panel (for drivers) -->

<div class="demand-panel">

<b>Waiting Passengers</b>

<div>
CV Raman : <span id="count_CV_RAMAN">0</span>
<button onclick="boarded('CV_RAMAN')">Boarded</button>
</div>

<div>
SR Block : <span id="count_SR_BLOCK">0</span>
<button onclick="boarded('SR_BLOCK')">Boarded</button>
</div>

<div>
Admin : <span id="count_ADMIN">0</span>
<button onclick="boarded('ADMIN')">Boarded</button>
</div>

<div>
X Lab : <span id="count_X_LAB">0</span>
<button onclick="boarded('X_LAB')">Boarded</button>
</div>

<div>
JC Bose : <span id="count_JC_BOSE">0</span>
<button onclick="boarded('JC_BOSE')">Boarded</button>
</div>

</div>


<div id="map"></div>


<div class="legend">
<b>Legend</b><br>
<img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="22"> Active Buggy<br>
<img src="https://cdn-icons-png.flaticon.com/512/744/744467.png" width="22"> Inactive Buggy
</div>

<script src="app.js"></script>

</body>

</html>
