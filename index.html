<!DOCTYPE html>
<html>

<head>

<title>SRMAP Buggy</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Custom Styles -->
<link rel="stylesheet" href="style.css">

<!-- Map Library -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

<div class="title-left">
Buggy Live Tracker | SRM University-AP
</div>

<div id="activeBuggies" class="update-time">
Active Buggies: 0
</div>

<div id="lastUpdate" class="update-time">
Last updated: --
</div>

<div class="title-right">
Centre for Geospatial Technology
</div>

</div>


<!-- ================= USER DASHBOARD ================= -->

<div class="userContainer">

<!-- MINI MAP -->

<div class="miniMapBox">
<div id="map"></div>
</div>


<!-- REQUEST SECTION -->

<div class="requestBox">

<h3>Request Buggy</h3>

<div class="requestGrid">

<button class="reqBtn" onclick="sendRequest('CV_RAMAN')">CV Raman</button>
<button class="reqBtn" onclick="sendRequest('SR_BLOCK')">SR Block</button>

<button class="reqBtn" onclick="sendRequest('ADMIN')">Admin</button>
<button class="reqBtn" onclick="sendRequest('X_LAB')">X Lab</button>

<button class="reqBtn" onclick="sendRequest('JC_BOSE')">JC Bose</button>
<button class="reqBtn" onclick="sendRequest('GATE6')">Gate 6 Parking</button>

</div>

<p id="requestStatus"></p>

</div>

</div>


<!-- ================= LEGEND ================= -->

<div class="legend">
<img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="20"> Active
&nbsp;&nbsp;&nbsp;
<img src="https://cdn-icons-png.flaticon.com/512/744/744467.png" width="20"> Inactive
</div>


<!-- ================= APPLICATION SCRIPT ================= -->

<script src="app.js"></script>

<script>

/* Prevent multiple requests */

function sendRequest(block){

const lastRequest = localStorage.getItem("lastBuggyRequestBlock");
const lastTime = localStorage.getItem("lastBuggyRequestTime");

if(lastTime){

const diff = Date.now() - lastTime;

if(diff < 600000){

document.getElementById("requestStatus").innerText =
"You already requested a buggy at " + lastRequest +
". Please wait a few minutes.";

return;

}

}

/* Call main request function */

requestBuggy(block);

/* Save locally */

localStorage.setItem("lastBuggyRequestBlock",block);
localStorage.setItem("lastBuggyRequestTime",Date.now());

/* Disable buttons */

const buttons = document.querySelectorAll(".reqBtn");

buttons.forEach(btn=>{
btn.disabled = true;
btn.style.opacity = 0.5;
});

document.getElementById("requestStatus").innerText =
"Request sent from " + block.replace("_"," ") +
". Please wait for the buggy.";

}

</script>

</body>

</html>
